[package]
name = "ohce"
version = "0.1.2" # change with html_root_url in lib.rs
edition = "2024"
authors = ["nomissbowling <nomissbowling@yahoo.co.jp>"]

description = "reverse echo"
keywords = ["directx", "opengl", "windows", "graphics", "3D"]
categories = ["simulation", "rendering", "science", "external-ffi-bindings"]
license = "MIT"

documentation = "https://docs.rs/ohce/"
homepage = "https://crates.io/crates/ohce"
repository = "https://github.com/nomissbowling/ohce"

readme = "README.md"

#build = "build.rs"

[lib]
name = "ohce"

[dependencies]
asciiz = {version="0.1"}
# anyslot = {version="0.1"}

#home = {version="=0.5.12"} # cc(1.2.53)/bindgen(0.72.1) requires home(0.5.12)

prayterm = { version = "1.0" }

crossterm = { version = "0.27.0" }

# crossterm = { version = "0.27.0", features = ["event-stream"] }
# crossbeam-channel = "0.5.12"

genawaiter = { version = "=0.99.1" }

[build-dependencies]
#cc = "=1.2.53"
#bindgen = "=0.72.1"

[package.metadata.docs.rs]
rustc-args = ["--cfg", "docsrs"]
